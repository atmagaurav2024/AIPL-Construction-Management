<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmagaurav Infra Pvt Ltd | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="login-card" aria-labelledby="login-heading">
        <header class="brand-block">
          <div class="logo-mark" aria-hidden="true">AI</div>
          <h1 id="login-heading">Secure Login</h1>
          <p class="tagline">The Signature of Strength in National Infrastructure</p>
        </header>

        <form class="login-form" id="login-form">
          <label for="lang">Language</label>
          <select id="lang" name="lang">
            <option value="en">English</option>
            <option value="mr">मराठी</option>
            <option value="hi">हिंदी</option>
          </select>

          <label for="mobile">Mobile Number</label>
          <input
            id="mobile"
            type="tel"
            name="mobile"
            placeholder="Enter your 10-digit mobile number"
            inputmode="numeric"
            pattern="[0-9]{10}"
            maxlength="10"
            required
          />

          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Enter your password" required />

          <button class="primary-btn" type="submit">Login to Dashboard</button>
        </form>

        <button id="forgot-toggle" class="forgot-toggle" type="button" aria-expanded="false" aria-controls="reset-password-panel">
          Forgot your password?
        </button>

        <div class="reset-password" id="reset-password-panel" aria-live="polite" hidden>
          <label for="reset-email">Reset link sent to email</label>
          <div class="reset-controls">
            <input id="reset-email" type="email" placeholder="Enter your registered email" />
            <button class="secondary-btn" type="button" id="send-reset-link">Send Reset Link</button>
          </div>
        </div>

        <footer class="helper-text">
          <p>Use Admin login: <b>9000000000</b> / <b>admin123</b>. Employee credentials are created from Admin Dashboard.</p>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
